<!doctype html>
<!--
  Source of public/og-image.png, the link preview shown when the site is shared (1200 × 630).
  To regenerate:
    chromium --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@500&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07070c; }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        color: #f3f0ea;
        font-family: 'Inter', sans-serif;
      }
      .eyebrow { margin: 0 0 18px; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #9a96a6; }
      .logo { margin: 0; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 114px; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
      .logo span { display: inline-block; }
      .fade1 { opacity: 0.45; filter: blur(3px); transform: translateY(-4px); }
      .fade2 { opacity: 0.12; filter: blur(7px); transform: translateY(-8px); }
      .lede { margin: 30px 0 0; font-size: 40px; font-weight: 500; line-height: 1.3; opacity: 0.85; }
      .squares { margin-top: 44px; display: flex; gap: 10px; }
      .squares i { width: 34px; height: 34px; border-radius: 6px; background: #3ecf6a; }
      .squares i.dead { background: #ff6b8b; }
      .squares i.off { background: rgba(255, 255, 255, 0.1); }
      .bits { position: absolute; right: 80px; top: 64px; width: 160px; height: 120px; }
      .bits b { position: absolute; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="bits">
      <b style="left: 0; top: 0; width: 44px; height: 44px; background: #ffd36b"></b>
      <b style="left: 80px; top: 26px; width: 34px; height: 34px; background: #7ee0ff"></b>
      <b style="left: 30px; top: 84px; width: 26px; height: 26px; background: #ff6b8b"></b>
    </div>
    <p class="eyebrow">A daily game</p>
    <h1 class="logo"><span>e</span><span>p</span><span class="fade1">h</span><span>e</span><span>m</span><span class="fade2">e</span><span>r</span><span>a</span><span class="fade1">l</span></h1>
    <p class="lede">A new game every day. Sixty seconds. One try.</p>
    <div class="squares"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="dead"></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div>
  </body>
</html>
