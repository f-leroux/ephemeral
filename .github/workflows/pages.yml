name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # daily: publishes tomorrow's game before the earliest time zone (UTC+14, at 10:00 UTC) reaches it
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install check tools (Strudel, to validate songs)
        run: npm ci
      - name: Check every game module and song
        run: node scripts/check-game.mjs
      - name: Build the public site (games up to tomorrow) and the private preview (everything)
        env:
          PREVIEW_PATH: ${{ secrets.PREVIEW_PATH }}
        run: node scripts/build-site.mjs _site "${GITHUB_SHA::8}-$(date -u +%Y%m%d)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
